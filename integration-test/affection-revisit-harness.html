<script>
// =====================================================================
// 独立 iframe mock harness：真实源 fetch('../index.html') → 在 <head> 注入
// mock（localStorage / fetch / matchMedia / TavernHelper 变量 API）→ 于 375px
// iframe 内 boot，用主代理约定的新接口做断言。不复制任何业务函数。
//
// mock 保真要点：
//   1) insertOrAssignVariables 为「深合并」（对象递归合并、数组/原子整体替换），
//      不能用 Object.assign 模拟——否则删键/清类目类 bug 会被浅替换掩盖；
//   2) replaceVariables 为「完整替换」并按 message_id 计数；
//   3) 隔离本地 LLM 配置：localStorage 返回 null（apiKey 为空），frame 内 fetch
//      被 mock 成 reject，绝不发出真实 LLM 网络请求；
//   4) matchMedia('(hover: hover) and (pointer: fine)') 可 mock（__hoverSupported）。
//
// 断言分两类：contract='existing'（现状应已满足）/ 'planned'（主代理计划落地的新约定）。
// 计划接口尚未落地时 → pending（待对齐），并在 capabilities 里逐条列出。
// =====================================================================
const logBox = document.getElementById('log');
function log(msg, cls) {
    const line = document.createElement('div');
    line.className = cls || 'info';
    line.textContent = msg;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
}

const R = { pass: 0, fail: 0, pending: 0, tests: [] };
// 能力探针：静态用类型/元素检查，行为用「小剂量试跑 + 复原」，
// 只有探针确认落地才跑对应新约定断言，否则记为待对齐 —— 避免把平行开发中的半成品误判成失败。
const CAPS = {};
const CAP_REASON = {
    saveGoodsEdit: 'saveGoodsEdit(shopName, originalCategory, originalIndex, fields) 未暴露',
    hover: 'supportsHoverProductPreview() 未暴露',
    hud: '#keeperAffectionValue / #keeperRelationship / affectionRelationship() / applyAffectionUi() 未就位',
    hudByApply: 'applyLLMResult 尚未同步 HUD（applyAffectionUi 未接入）',
    hudDelta: 'applyLLMResult 尚未把好感变化写入 #keeperAffectionDelta（HUD 未接线）',
    nameOnly: 'parseShopBlockYaml 对「仅店名块」尚未返回对象（回访恢复链路未落地）',
    affClamp: 'applyLLMResult 尚未对 affection 做 -5..+1 整数硬钳制',
    affEnter: 'applyLLMResult 尚未按 options.scene==="enter" 跳过好感',
    updateSync: 'updateShopAffection 自身未同步运行态 window.__shopAffection（当前同步由 changeShopAffection 承担，二选一对齐即可）',
    hudSync: 'updateShopAffection 自身未同步 HUD（值/关系档位）（当前同步由 changeShopAffection 承担，二选一对齐即可）',
    bubbleEmoji: 'keeperDisplayName(name, delta) 的 🙂/😠 尚未接入老板气泡名称'
};

function flush() {
    const total = R.pass + R.fail + R.pending;
    document.getElementById('summary').textContent =
        (R.fail === 0 ? '✅ ' : '❌ ') + R.pass + ' 通过 / ' + R.fail + ' 失败 / ' + R.pending + ' 待对齐（共 ' + total + '）';
    const plannedFailing = R.tests.filter(t => t.contract === 'planned' && t.status !== 'pass')
        .map(t => ({ name: t.name, status: t.status, detail: t.detail }));
    window.__harnessResult = {
        ok: R.fail === 0,
        pass: R.pass, fail: R.fail, pending: R.pending, total: total,
        capabilities: CAPS,
        plannedNotGreen: plannedFailing,
        tests: R.tests
    };
    document.getElementById('result').textContent = JSON.stringify(window.__harnessResult, null, 2);
}

function record(name, status, contract, detail) {
    R.tests.push({ name: name, status: status, contract: contract, detail: detail || '' });
    if (status === 'pass') R.pass++; else if (status === 'fail') R.fail++; else R.pending++;
    const mark = status === 'pass' ? '✓' : status === 'fail' ? '✗' : '…';
    log(mark + ' [' + (contract === 'planned' ? '新约定' : '既有') + '] ' + name + (detail ? ' — ' + detail : ''),
        status === 'pass' ? 'pass' : status === 'fail' ? 'fail' : 'info');
    flush();
}

async function check(name, contract, cap, fn) {
    if (cap && !CAPS[cap]) { record(name, 'pending', contract, '待对齐：' + CAP_REASON[cap]); return; }
    try {
        const res = await fn();
        if (res === true || res === undefined || res === null) record(name, 'pass', contract, '');
        else if (res && typeof res === 'object' && res.pending) record(name, 'pending', contract, res.pending);
        else record(name, 'fail', contract, String(res));
    } catch (e) {
        record(name, 'fail', contract, '异常: ' + ((e && e.message) || e));
    }
}

// 软断言：结果不符时报「待对齐」而非失败，用于无法静态探测的能力（如并发幂等）
async function checkSoft(name, cap, reason, fn) {
    if (cap && !CAPS[cap]) { record(name, 'pending', 'planned', '待对齐：' + CAP_REASON[cap]); return; }
    try {
        const res = await fn();
        if (res === true || res === undefined || res === null) record(name, 'pass', 'planned', '');
        else record(name, 'pending', 'planned', (reason || '待对齐') + '：' + String(res));
    } catch (e) {
        record(name, 'pending', 'planned', (reason || '待对齐') + '：异常 ' + ((e && e.message) || e));
    }
}

// ---------------- frame 通信 ----------------
const frameEl = () => document.getElementById('shopFrame');
const W = () => frameEl().contentWindow;
const E = (code) => W().eval(code);
const EA = async (code) => await W().eval(code);
const J = JSON.stringify;

async function waitUntil(fn, timeout = 6000) {
    const t0 = Date.now();
    while (Date.now() - t0 < timeout) {
        let ok = false;
        try { ok = await fn(); } catch (e) { /* 尚未就绪 */ }
        if (ok) return true;
        await new Promise(r => setTimeout(r, 100));
    }
    return false;
}

// 商品编辑字段契约：{name, category, price, count, unit, desc, tag}
function goodsFields(o) {

// ------ 读持久层（frame 内 __hStore.chat['$shops']） ------
async function readShops() {
    return JSON.parse(await E('JSON.stringify(window.__hStore.chat["$shops"] || null)') || 'null');
}
function persistedExpr(shop) {
    return '(function(){var s=(window.__hStore.chat["$shops"]||{})[' + J(shop) + '];if(!s)return "null";' +
        'var c=s["分类商品"]||{};var cats={};for(var k in c){cats[k]=(c[k]||[]).map(function(e){var g=e["商品"]||e;return String(g["名字"]);});}' +
        'var ex=(s["独家私藏"]||[]).map(function(e){var g=e["商品"]||e;return String(g["名字"]);});' +
        'return JSON.stringify({cats:cats,exclusive:ex,aff:s["好感度"],meta:s["$meta"]||null,persona:s["店主性格"]||""});})()';
}
async function readPersisted(shop) {
    return JSON.parse(await E(persistedExpr(shop)));
}
function cleanCatsExpr(shop) {
    return '(function(){var s=(window.__hStore.chat["$shops"]||{})[' + J(shop) + '];if(!s)return "null";' +
        'var c=s["分类商品"]||{};var out={};var all=[];for(var k in c){(c[k]||[]).forEach(function(e){var g=e["商品"]||e;var n=getCleanNameAndEmoji(g["名字"]).name;out[k]=out[k]||[];out[k].push(n);all.push(n);});}' +
        '(s["独家私藏"]||[]).forEach(function(e){var g=e["商品"]||e;var n=getCleanNameAndEmoji(g["名字"]).name;out["独家私藏"]=out["独家私藏"]||[];out["独家私藏"].push(n);all.push(n);});' +
        'return JSON.stringify({cats:out,all:all});})()';
}
async function readCleanCats(shop) {
    return JSON.parse(await E(cleanCatsExpr(shop)));
}
async function runtimeNames() {
    return JSON.parse(await E('JSON.stringify(shopState ? shopState.items.map(function(i){return i.name;}) : null)'));

// 键序无关的规范化快照（失败不落地对比：避免等价对象因键序不同被误判为「已改动」）
const CANON_FN = '(function c(o){if(Array.isArray(o))return "["+o.map(c).join(",")+"]";' +
    'if(o&&typeof o==="object")return "{"+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+":"+c(o[k]);}).join(",")+"}";' +
    'return JSON.stringify(o===undefined?null:o);})';
async function canonShops() { return await E(CANON_FN + '(window.__hStore.chat["$shops"])'); }
async function canonRuntime() { return await E(CANON_FN + '(shopState.items)'); }

async function loadShop(yaml) {

}

function cashOf(stat) {
    try {
        const raw = stat['状态栏']['团队资金']['现金'];
        const m = String(raw).replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
        return m ? parseFloat(m[0]) : null;
    } catch (e) { return null; }
}
function itemsOf(stat, who) {
    try {
        const list = stat['状态栏']['角色列表'];
        const hit = list.find(e => {
            const c = e['角色'] || e['用户'];
            return c && String(c['名字']).includes(who);
        });
        return ((hit['角色'] || hit['用户'])['物品']) || '';
    } catch (e) { return null; }
}
function countSub(str, sub) {
    if (!str) return 0;
    return str.split(sub).length - 1;
}

// =====================================================================
// 主流程
// =====================================================================
async function runFlow() {
    logBox.innerHTML = '';
    document.getElementById('result').textContent = '';
    R.pass = R.fail = R.pending = 0; R.tests.length = 0;
    flush();

    // ---------------- A. boot（真实源 + boot 前 mock） ----------------
    log('== A. 真实源加载 + boot 前 mock 注入 ==');
    const mockScript = [
        '<script>',
        '(function(){',
        '  // boot 前注入：变量 API（深合并 insert / 完整替换 replace）、楼层 API、媒体查询、localStorage、网络隔离',
        '  window.__hStats = { chatInsert: 0, chatReplace: 0, msgInsert: {}, msgReplace: {}, llmFetch: 0, fetchUrls: [], lsSet: [], lsGet: [], emits: [], slashCalls: [], alerts: [], mediaQueries: [] };',
        '  window.__hoverSupported = true;',
        '  window.__hStore = { chat: {}, m7: null };',
        '  function clone(v){ return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }',
        '  function plain(o){ return o && typeof o === "object" && !Array.isArray(o); }',
        '  function merge(t, s){ for (var k in s){ if (!Object.prototype.hasOwnProperty.call(s, k)) continue; var v = s[k]; if (v === undefined) continue; if (plain(v) && plain(t[k])) merge(t[k], v); else t[k] = clone(v); } return t; }',
        '  window.__hBootId = (window.__hBootId || 0) + 1;',
        '  window.__hResetMms = function(){ window.__hStore.m7 = { stat_data: { "状态栏": { "团队资金": { "现金": "100.00美元" }, "角色列表": [ { "角色": { "名字": "埃利奥特", "物品": "" } }, { "角色": { "名字": "弗兰克", "物品": "" } } ] } }, "$mms_meta": { mesId: 7 } }; };',
        '  window.__hResetMms();',
        '  window.getCurrentMessageId = function(){ return 7; };',
        '  window.getLastMessageId = function(){ return 7; };',
        '  window.getVariables = function(opts){ var isMsg = opts && opts.type === "message"; var key = isMsg ? ("m" + opts.message_id) : "chat"; var src = window.__hStore[key]; return Promise.resolve(src ? clone(src) : (isMsg ? null : {})); };',
        '  window.insertOrAssignVariables = function(obj, opts){ if (!obj || typeof obj !== "object") return Promise.resolve(false); if (opts && opts.type === "message"){ var mk = "m" + opts.message_id; window.__hStats.msgInsert[mk] = (window.__hStats.msgInsert[mk] || 0) + 1; window.__hStore[mk] = merge(window.__hStore[mk] || {}, obj); } else { window.__hStats.chatInsert++; window.__hStore.chat = merge(window.__hStore.chat || {}, obj); } return Promise.resolve(true); };',
        '  window.replaceVariables = function(obj, opts){ if (opts && opts.type === "message"){ var mk = "m" + opts.message_id; window.__hStats.msgReplace[mk] = (window.__hStats.msgReplace[mk] || 0) + 1; window.__hStore[mk] = clone(obj) || {}; } else { window.__hStats.chatReplace++; window.__hStore.chat = clone(obj) || {}; } return Promise.resolve(true); };',
        '  window.eventOn = function(){};',
        '  window.eventEmit = function(name, payload){ window.__hStats.emits.push({ name: name, payload: payload }); };',
        '  window.alert = function(msg){ window.__hStats.alerts.push(String(msg)); };',
        '  window.confirm = function(){ return true; };',
        '  window.triggerSlash = function(cmd){ window.__hStats.slashCalls.push(String(cmd)); return Promise.resolve(true); };',
        '  window.fetch = function(url){ window.__hStats.llmFetch++; window.__hStats.fetchUrls.push(String(url)); return Promise.reject(new Error("harness: 网络已在 mock 中禁用")); };',
        '  window.matchMedia = function(q){ window.__hStats.mediaQueries.push(q); var isHover = String(q).indexOf("hover: hover") !== -1; return { media: q, matches: isHover ? !!window.__hoverSupported : false, onchange: null, addListener: function(){}, removeListener: function(){}, addEventListener: function(){}, removeEventListener: function(){}, dispatchEvent: function(){ return false; } }; };',
        '  var lsData = {};',
        '  Object.defineProperty(window, "localStorage", { configurable: true, value: { get length(){ return Object.keys(lsData).length; }, getItem: function(k){ window.__hStats.lsGet.push(k); return Object.prototype.hasOwnProperty.call(lsData, k) ? lsData[k] : null; }, setItem: function(k, v){ window.__hStats.lsSet.push(k); lsData[k] = String(v); }, removeItem: function(k){ delete lsData[k]; }, clear: function(){ lsData = {}; }, key: function(i){ return Object.keys(lsData)[i] || null; } } });',
        '})();',
        '<\/script>'
    ].join('\n');
    const src = await fetch('../index.html').then(r => r.text());
    // 真实源只做一次 <head> 前置注入；mock 依赖的 __hStats/__hStore/__hoverSupported 全部在组件脚本之前就位
    frameEl().srcdoc = src.replace('<head>', '<head>' + mockScript);
    const booted = await waitUntil(() => E(
        'document.readyState === "complete" && typeof onShopDataReceived === "function" && typeof applyLLMResult === "function"'
        + ' && typeof parseShopBlockYaml === "function" && typeof checkoutCart === "function"'
        + ' && typeof saveShopEdits === "function" && typeof updateShopAffection === "function"'
    ), 20000);
    await check('组件 boot 就绪（入口/解析/LLM/结算/编辑函数可用）', 'existing', null, () => booted || 'boot 超时');

    // ---------------- A2. 能力探针（静态） ----------------
    log('== A2. 能力探针（静态）：哪些新约定已落地 ==');
    CAPS.saveGoodsEdit = await E('typeof saveGoodsEdit === "function"');
    CAPS.hover = await E('typeof supportsHoverProductPreview === "function"');
    CAPS.hud = await E('(function(){try{return typeof affectionRelationship === "function"'
        + ' && typeof applyAffectionUi === "function"'
        + ' && !!document.getElementById("keeperAffectionValue")'
        + ' && !!document.getElementById("keeperRelationship")'
        + ' && !!document.getElementById("keeperAffectionDelta");}catch(e){return false;}})()');
    CAPS.bubbleEmoji = await E('(function(){try{'
        + 'if (typeof keeperDisplayName !== "function") return false;'
        + 'var s = String(applyLLMResult) + String(showKeeperDialogue) + String(showAvatarChatBubble) + String(popBossSpeechBubble);'
        + 'return s.indexOf("keeperDisplayName") !== -1;'
        + '}catch(e){ return false; }})()');

    const panelReady = await waitUntil(() => E('!!assignState && assignState.targets.length > 0'), 8000)
        // 再等商品柜按当前购物车重新渲染完毕，确保点到的是本轮的商品卡
        && await waitUntil(() => E('document.querySelectorAll("#cartCabinet .cart-shelf-cell").length === playerState.cart.length'), 8000);
    let assignOK = false;
    if (panelReady) {
        await E('(function(){var b=Array.prototype.slice.call(document.querySelectorAll("#assignTargets button")).filter(function(x){return (x.getAttribute("title")||"").indexOf("埃利奥特")!==-1;})[0]; if(b) b.click();})()');
        await E('(function(){var c=document.querySelector("#cartCabinet .cart-shelf-cell"); if(c) c.click();})()');
        assignOK = await waitUntil(() => E('!!assignState && assignState.assigned.length === 1'), 3000);
    }
    const cartBefore = await E('playerState.cart.length');
    // 断链诊断：点选/归属失败时能直接看出断在哪一步（面板未渲染 / 未选中对象 / 未分配）
    const assignDiag = JSON.parse(await E('JSON.stringify({targets:document.querySelectorAll("#assignTargets button").length,'
        + 'cells:document.querySelectorAll("#cartCabinet .cart-shelf-cell").length,active:assignState&&assignState.activeTarget?assignState.activeTarget.name:null,'
        + 'assigned:assignState?assignState.assigned.length:null,cart:playerState.cart.length})'));
    // 并发双击：任一分支抛错（并发未防护时的典型表现：assignState 被前一次置空）不得让整轮 harness 崩掉，
    // 收敛为 rejected 文本，交给下面的软断言报「待对齐」
    const ckRejects = JSON.parse(await EA('Promise.all([checkoutCart(), checkoutCart()].map(function(p){'
        + 'return Promise.resolve(p).then(function(){return "";}).catch(function(e){return String((e&&e.message)||e);});}))'
        + '.then(function(list){return JSON.stringify(list.filter(Boolean));})'));
    await waitUntil(() => E('playerState.cart.length === 0'), 5000);
    const CK = {
        panelReady: panelReady, assignOK: assignOK, cartBefore: cartBefore,
        stat: await readStat(),
        shops: await readShops(),
        rtAff: await E('window.__shopAffection'),
        msgReplace: (await E('(__hStats.msgReplace["m7"]||0)')) - preMsgReplace,
        hist: (await E('playerState.purchaseHistory.length')) - preHist,
        deal: JSON.parse(await E('JSON.stringify(window.__hStore.chat["$shop_deal_result"] || null)') || 'null'),
        alerts: JSON.parse(await E('JSON.stringify(__hStats.alerts)')),
        cartLeft: await E('playerState.cart.length'),
        rejects: ckRejects, assignDiag: assignDiag
    };
    CK.cash = cashOf(CK.stat);
    CK.items = itemsOf(CK.stat, '埃利奥特');
    CK.aff = (CK.shops && CK.shops[SHOP]) ? CK.shops[SHOP]['好感度'] : null;

    await check('结算前置：归属分配完成、购物车 1 件', 'existing', null, () => {
        if (!(MPRICE > 0)) return '运行态未找到 黄铜扳手（单价=' + MPRICE + '）';
        if (!CK.panelReady) return '结算面板未渲染出归属目标 ' + JSON.stringify(CK.assignDiag);
        if (!CK.assignOK) return '归属未落地 ' + JSON.stringify(CK.assignDiag);
        if (CK.cartBefore !== 1) return '购物车条目=' + CK.cartBefore;
        if (CK.alerts.length) return '结算期间出现 alert：' + CK.alerts.join(' | ');
        return true;
    });
    await check('双击结算：现金只扣一次（100 → ' + MCASH + '）', 'planned', null, () => {
        const extra = CK.rejects.length ? '；并发分支抛错: ' + CK.rejects.join(' | ') : '';
        return (CK.cash === MCASH) || ('团队现金=' + CK.cash + '（期望 ' + MCASH + '，实际扣款 ' + (CK.cash === null ? '?' : ((100 - CK.cash) / MPRICE).toFixed(1)) + ' 次）' + extra);
    });
    await check('双击结算：stat_data 物品只加一次', 'planned', null, () => {
        const n = countSub(CK.items, '黄铜扳手');
        return (n === 1) || ('物品串出现 ' + n + ' 次：' + CK.items);
    });
    await check('双击结算：购物好感奖励只加一次（30 → ' + MAFF + '，$' + MPRICE + '/5）', 'planned', null, () => {
        if (CK.aff !== MAFF) return '持久好感=' + CK.aff + '（期望 ' + MAFF + '）';
        if (CK.rtAff !== MAFF) return '运行态好感=' + CK.rtAff + '（期望 ' + MAFF + '）';
        return true;
    });
    await check('双击结算：只生成一条成交（purchaseHistory +1 / $shop_deal_result 1 条）+ stat_data 写入一次', 'planned', null, () => {
        if (CK.cartLeft !== 0) return '购物车未清空：' + CK.cartLeft;
        if (CK.hist !== 1) return 'purchaseHistory 增量=' + CK.hist + '（期望 1）';
        if (!CK.deal) return '$shop_deal_result 未写入';
        if (!Array.isArray(CK.deal.purchases) || CK.deal.purchases.length !== 1) return '$shop_deal_result.purchases=' + JSON.stringify(CK.deal.purchases);
        if (CK.msgReplace !== 1) return 'stat_data 写入（replaceVariables）次数=' + CK.msgReplace + '（期望 1）';
        return true;
    });

    // ---------------- N. 悬停预览 ----------------
    log('== N. 悬停预览：supportsHoverProductPreview + pointerenter/leave ==');
    // 组件在 boot 时一次性取 matchMedia('(hover: hover) and (pointer: fine)') 的 MediaQueryList 并缓存，
    // 所以「能力由 boot 时媒体查询决定」——本段验证正路，末段再以 __hoverSupported=false 重新 boot 验证降级路。
    await check('supportsHoverProductPreview() 由 boot 时 matchMedia("(hover: hover) and (pointer: fine)") 决定', 'planned', 'hover', async () => {
        const on = await E('supportsHoverProductPreview()');
        if (on !== true) return 'boot 时 hover 能力为真，却返回 ' + on;
        const queries = JSON.parse(await E('JSON.stringify(__hStats.mediaQueries)'));
        const hit = queries.some(q => String(q).indexOf('hover: hover') !== -1 && String(q).indexOf('pointer: fine') !== -1);
        if (!hit) return '未以 "(hover: hover) and (pointer: fine)" 查询媒体特性，实际=' + JSON.stringify(queries);
        return true;
    });
    await check('pointerenter 弹出 bossSpeechBubble / pointerleave 收起', 'planned', 'hover', async () => {
        await E('(function(){ shopState && (currentCategory = "all", renderCabinet()); })()');
        const hasCell = await waitUntil(() => E('!!document.querySelector("#woodenCabinet .shelf-cell")'), 3000);
        if (!hasCell) return '货柜无可悬停格子';
        await clearBubbles();
        const fire = (type) => E('(function(){var c=document.querySelector("#woodenCabinet .shelf-cell");'
            + 'var ev;try{ev=new PointerEvent(' + J(type) + ');}catch(e){ev=new Event(' + J(type) + ');}c.dispatchEvent(ev);})()');
        await fire('pointerenter');
        const shown = await waitUntil(() => E('document.getElementById("bossSpeechBubble").classList.contains("show")'), 2500);
        if (!shown) return 'pointerenter 未弹出 bossSpeechBubble';
        await fire('pointerleave');
        const hidden = await waitUntil(() => E('!document.getElementById("bossSpeechBubble").classList.contains("show")'), 2500);
        return hidden || 'pointerleave 未收起 bossSpeechBubble';
    });
    if (CAPS.hover) {
        await check('降级路（hover 能力为假）→ supportsHoverProductPreview() false，pointerenter 不弹气泡', 'planned', 'hover', async () => {
            await E('(function(){ hoverProductMedia.matches = false; renderCabinet(); })()');
            const off = await E('supportsHoverProductPreview()');
            if (off !== false) return 'hover 能力为假时仍返回 ' + off;
            await clearBubbles();
            await E('(function(){var c=document.querySelector("#woodenCabinet .shelf-cell");'
                + 'var ev;try{ev=new PointerEvent("pointerenter");}catch(e){ev=new Event("pointerenter");}c.dispatchEvent(ev);})()');
            await new Promise(r => setTimeout(r, 600));
            const shown = await E('document.getElementById("bossSpeechBubble").classList.contains("show")');
            await E('hoverProductMedia.matches = true');
            return (shown === false) || '降级路仍弹出了 bossSpeechBubble';
        });
    }
    await clearBubbles();

    const total = R.pass + R.fail + R.pending;
    log('== 完成：' + R.pass + ' 通过 / ' + R.fail + ' 失败 / ' + R.pending + ' 待对齐（共 ' + total + '） ==',
        R.fail ? 'fail' : 'pass');
    flush();
}

document.getElementById('btnRun').addEventListener('click', () => {
    runFlow().catch(e => {
        log('流程异常：' + ((e && e.message) || e), 'fail');
        record('harness 流程异常', 'fail', 'existing', String((e && e.stack) || e));
    });
});
window.__runHarness = runFlow;
</script>
</body>
</html>
